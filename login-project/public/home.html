<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/home.css">
    <title>Home</title>
</head>
   
<body class="home">
    <header class="header">
        <p class="logo">To_Do List</p>
        <button onclick="window.location.href='/logout'" class="logout"><a href="/logout">Déconnexion</a></button>
    </header>

    <h1 class="title">Bienvenue</h1>

    <main class="main">
        <form action="/todos" method="post" id="add-form">
            <input type="text" name="task" id="task-input" placeholder=" Nouvelle tâche" required>
            <button type="submit" class="ajouter">Ajouter</button>
        </form>
    </main>

    <div class="todo">
        <ul id="todo-list"></ul>
    </div>
    <script src="inc/todos.js"></script>
</body>
</html>
